[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-jarvis"
version = "0.1.0"
description = "Turn a Home Assistant Voice PE (or any ESPHome voice satellite) into a speech-first JARVIS for the Hermes agent or any OpenAI-compatible model."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Praharsh Bhatt" }]
keywords = ["voice-assistant", "esphome", "home-assistant", "hermes", "piper", "jarvis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "aioesphomeapi>=46.0",
  "aiohttp>=3.12",
  "numpy>=1.26",
  "piper-tts>=1.3",
  "pysilero-vad>=3.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/praharshbhatt/hermes-jarvis"
Documentation = "https://github.com/praharshbhatt/hermes-jarvis/tree/main/docs"
Issues = "https://github.com/praharshbhatt/hermes-jarvis/issues"
Changelog = "https://github.com/praharshbhatt/hermes-jarvis/blob/main/CHANGELOG.md"

[project.optional-dependencies]
local-stt = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hermes-jarvis = "hermes_jarvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
