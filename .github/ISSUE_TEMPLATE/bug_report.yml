name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please run `hermes-jarvis doctor` first, it finds most setup problems. Remove API keys and anything private from what you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `hermes-jarvis doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log
      description: From `hermes-jarvis run -v`, around the time of the problem.
      render: text
  - type: input
    id: version
    attributes:
      label: hermes-jarvis version
      description: "`hermes-jarvis --version`"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [pip, Docker, from a clone, other]
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Brain, speech-to-text provider, and device
      placeholder: "Hermes 0.22 / ElevenLabs / Voice PE"
