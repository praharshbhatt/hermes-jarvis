name: Release

# Push a tag like v0.1.0 to build the firmware, publish the web flasher, and push the container image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

  firmware:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the images to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "esphome==2025.7.2"
      - name: Compile
        run: esphome compile firmware/hermes-jarvis.yaml
      - name: Assemble the web flasher
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          B=firmware/.esphome/build/hermes-jarvis/.pioenvs/hermes-jarvis
          python scripts/make_flash_site.py --version "$VERSION" --factory "$B/firmware.factory.bin" --out site
          cp "$B/firmware.ota.bin" site/hermes-jarvis.ota.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Attach firmware to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            site/hermes-jarvis.factory.bin
            site/hermes-jarvis.ota.bin
          generate_release_notes: true

  pages:
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pypi:
    # Off until you set it up: create the project on PyPI with "trusted publishing" for this repository, then set the
    # repository variable PUBLISH_TO_PYPI to "true".
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the web UI into the package, so the wheel always ships a fresh one
        run: scripts/build_ui.sh
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
