name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Is the committed UI export current?
        # Not blocking: build output can differ slightly between Node versions. Run scripts/build_ui.sh and commit if this warns.
        continue-on-error: true
        working-directory: .
        run: |
          scripts/build_ui.sh --fast
          git diff --stat --exit-code -- src/hermes_jarvis/static/app || { echo "::warning::src/hermes_jarvis/static/app is out of date; run scripts/build_ui.sh and commit"; exit 1; }

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_links.py

  firmware-config:
    # Fast check that the firmware YAML still validates (a full compile runs on release).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "esphome==2025.7.2"
      - run: esphome config firmware/hermes-jarvis.yaml > /dev/null

  adopt:
    # The device adoption flow end to end, against a small ESPHome "host" device built from the same API settings as the firmware.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . "esphome==2025.7.2"
      - run: ESPHOME=esphome HJ=hermes-jarvis PY=python scripts/test_adopt_host.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hermes-jarvis:ci .
      - run: docker run --rm hermes-jarvis:ci hermes-jarvis --version
      - run: docker run --rm hermes-jarvis:ci hermes-jarvis init /tmp/x
